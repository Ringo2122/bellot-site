name: Мониторинг сайта

# Каждые 30 минут: монитор сайта (tools/monitor.mjs — настоящий Chrome, компьютер и iPhone) и состояние робота
# и Telegram-бота лотов → сигнал в личку Telegram отдельным ботом (app/alert.rb). Одна и та же проблема —
# один раз (после второй проверки подряд), напоминание раз в 12 часов, «исправлено», когда пропала.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # alert.rb смотрит, запускал ли GitHub робота по расписанию

concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Europe/Minsk
      SB_URL: ${{ secrets.SB_URL }}
      SB_KEY: ${{ secrets.SB_KEY }}
      SB_TOKEN: ${{ secrets.SB_TOKEN }}
      ALERT_TG_TOKEN: ${{ secrets.ALERT_TG_TOKEN }}
      ALERT_TG_CHAT: ${{ secrets.ALERT_TG_CHAT }}
      GH_TOKEN: ${{ github.token }}   # только чтение запусков этого репозитория
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            app
            tools

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.2'

      - name: Управление Chrome для проверки
        run: npm install --no-save --no-audit --no-fund puppeteer-core@23.11.1 > /dev/null   # точная версия: обновление пакета не придёт само

      - name: Проверить сайт
        continue-on-error: true
        run: |
          mkdir -p tmp
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium) node tools/monitor.mjs > tmp/monitor.json
          cat tmp/monitor.json

      - name: Сигнал в Telegram
        run: ruby app/alert.rb tmp/monitor.json
