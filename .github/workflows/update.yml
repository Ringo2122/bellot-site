name: Обновление сайта

# Раз в 10 минут робот заглядывает в админку (gate.rb) и решает, что делать:
#   • наступил час обхода (по умолчанию 11:00 и 18:00 по Минску, меняется в админке) — обойти площадки и собрать сайт;
#   • в админке нажали «Опубликовать» или «Обновить с площадок» — собрать сайт (и обойти площадки);
#   • каждый час с 8 до 22 между обходами — проверить итоги завершившихся торгов и собрать сайт (2–3 минуты);
#   • иначе — ничего, проверка занимает полминуты.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: 'Обойти площадки (если снять — только пересобрать сайт)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/**']   # правка кода — пересобрать сайт без обхода

# по умолчанию — только чтение; запись в репозиторий и на Pages — только у шага сборки
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      collect: ${{ steps.g.outputs.collect }}
      results: ${{ steps.g.outputs.results }}
      build: ${{ steps.g.outputs.build }}
      run_id: ${{ steps.g.outputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: app     # память робота с фото не нужна — только скрипты

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.2'

      - id: g
        name: Пора ли работать
        env:
          TZ: Europe/Minsk
          EVENT: ${{ github.event_name }}
          INPUT_COLLECT: ${{ inputs.collect }}
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
          SB_TOKEN: ${{ secrets.SB_TOKEN }}
        run: ruby app/gate.rb

  update:
    needs: gate
    permissions:
      contents: write
      pages: write
      id-token: write
    if: needs.gate.outputs.build == 'true'
    concurrency:
      group: site
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Minsk
      COLLECT: ${{ needs.gate.outputs.collect }}
      RESULTS: ${{ needs.gate.outputs.results }}
      RUN_ID: ${{ needs.gate.outputs.run_id }}
      SB_URL: ${{ secrets.SB_URL }}
      SB_KEY: ${{ secrets.SB_KEY }}
      SB_TOKEN: ${{ secrets.SB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # память — свежая, а не на момент запуска: 04.10 обход 9:00 час ждал в очереди за ночным архивом,
          # взял память до архива и не смог сохраниться (конфликт data/lots.json)
          ref: main

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.2'

      - name: ImageMagick для фото
        run: command -v convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)

      - name: Обход площадок
        if: env.COLLECT == 'true' || env.RESULTS == 'true'
        shell: bash
        run: |
          mkdir -p tmp
          # проверка итогов — тот же робот без обхода площадок
          if [ "$COLLECT" != 'true' ]; then export RESULTS_ONLY=1; fi
          ruby app/update.rb 2>&1 | tee tmp/update.log
          exit ${PIPESTATUS[0]}

      - name: Рыночный ориентир (Kufar)
        if: env.COLLECT == 'true'
        continue-on-error: true
        run: ruby app/market.rb && ruby app/market_realty.rb

      - name: Сохранить память
        if: env.COLLECT == 'true' || env.RESULTS == 'true'
        run: |
          git config user.name "bellot-bot"
          git config user.email "bellot-bot@users.noreply.github.com"
          git add -A data
          git commit -q -m "данные: $(date '+%d.%m.%Y %H:%M')" || echo "без изменений"
          git push || (git pull --rebase -q && git push)

      - name: Сборка сайта
        run: ruby app/build.rb

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Отчёт и копия каталога — в админку
        if: always()
        continue-on-error: true
        env:
          JOB_OK: ${{ job.status == 'success' }}
        run: ruby app/sync.rb

      - name: Сигнал о сбое — в Telegram
        if: failure()
        continue-on-error: true
        env:
          ALERT_TG_TOKEN: ${{ secrets.ALERT_TG_TOKEN }}
          ALERT_TG_CHAT: ${{ secrets.ALERT_TG_CHAT }}
        run: ruby app/alert.rb --event "прогон робота упал (${{ needs.gate.outputs.collect == 'true' && 'обход площадок' || needs.gate.outputs.results == 'true' && 'проверка итогов' || 'сборка сайта' }})"
