name: Обновление сайта

# Раз в 10 минут робот заглядывает в админку (gate.rb) и решает, что делать:
#   • наступил час обхода (по умолчанию 11:00 и 18:00 по Минску, меняется в админке) — обойти площадки и собрать сайт;
#   • в админке нажали «Опубликовать» или «Обновить с площадок» — собрать сайт (и обойти площадки);
#   • иначе — ничего, проверка занимает полминуты.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: 'Обойти площадки (если снять — только пересобрать сайт)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/**']   # правка кода — пересобрать сайт без обхода

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      collect: ${{ steps.g.outputs.collect }}
      build: ${{ steps.g.outputs.build }}
      run_id: ${{ steps.g.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app     # память робота с фото не нужна — только скрипты

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - id: g
        name: Пора ли работать
        env:
          TZ: Europe/Minsk
          EVENT: ${{ github.event_name }}
          INPUT_COLLECT: ${{ inputs.collect }}
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
          SB_TOKEN: ${{ secrets.SB_TOKEN }}
        run: ruby app/gate.rb

  update:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    concurrency:
      group: site
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Minsk
      COLLECT: ${{ needs.gate.outputs.collect }}
      RUN_ID: ${{ needs.gate.outputs.run_id }}
      SB_URL: ${{ secrets.SB_URL }}
      SB_KEY: ${{ secrets.SB_KEY }}
      SB_TOKEN: ${{ secrets.SB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: ImageMagick для фото
        run: command -v convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)

      - name: Обход площадок
        if: env.COLLECT == 'true'
        shell: bash
        run: |
          mkdir -p tmp
          ruby app/update.rb 2>&1 | tee tmp/update.log
          exit ${PIPESTATUS[0]}

      - name: Рыночный ориентир (Kufar)
        if: env.COLLECT == 'true'
        continue-on-error: true
        run: ruby app/market.rb && ruby app/market_realty.rb

      - name: Сохранить память
        if: env.COLLECT == 'true'
        run: |
          git config user.name "bellot-bot"
          git config user.email "bellot-bot@users.noreply.github.com"
          git add -A data
          git commit -q -m "данные: $(date '+%d.%m.%Y %H:%M')" || echo "без изменений"
          git push || (git pull --rebase -q && git push)

      - name: Сборка сайта
        run: ruby app/build.rb

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Отчёт и копия каталога — в админку
        if: always()
        continue-on-error: true
        env:
          JOB_OK: ${{ job.status == 'success' }}
        run: ruby app/sync.rb
