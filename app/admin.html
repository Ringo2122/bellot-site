<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Админка БелЛот</title>
<style>
  :root{
    --brand:#12508f; --brand-d:#0d3c6e; --brand-l:#e8f0f8;
    --accent:#d9761f; --accent-l:#fdf1e4;
    --ok:#1d7a4d; --ok-l:#e6f3ec; --bad:#b3261e; --bad-l:#fbeaea;
    --ink:#1a2330; --ink-2:#4a5563; --ink-3:#77818d;
    --bg:#f2f4f7; --card:#fff; --hair:#dde2e8; --hair-2:#c6cdd6;
    --sh:0 1px 3px rgba(20,30,45,.08); --sh-2:0 10px 40px rgba(20,30,45,.22);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  a{color:var(--brand)}
  h1{font-size:22px;margin:0 0 4px}
  h2{font-size:16px;margin:0 0 10px}
  .lede{color:var(--ink-2);margin:0 0 18px;max-width:760px}
  button,input,select,textarea{font:inherit;color:inherit}
  input,select,textarea{border:1px solid var(--hair-2);border-radius:6px;padding:7px 9px;background:#fff;min-width:0}
  textarea{width:100%;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair-2);background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
  .btn:hover{border-color:var(--brand)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.bad{color:var(--bad);border-color:#e5b4b0}
  .btn.sm{padding:4px 9px;font-size:13px}
  .btn:disabled{opacity:.55;cursor:default}
  .muted{color:var(--ink-3)}
  .panel{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:16px;box-shadow:var(--sh);margin-bottom:16px}

  /* вход */
  #login{min-height:100vh;display:grid;place-items:center;padding:16px}
  #login form{width:100%;max-width:340px;background:#fff;border-radius:12px;padding:26px;box-shadow:var(--sh-2)}
  #login h1{margin-bottom:16px}
  #login label{display:block;margin:10px 0 4px;color:var(--ink-2);font-size:13px}
  #login input{width:100%}
  #login .btn{width:100%;justify-content:center;margin-top:16px;padding:10px}
  .err{color:var(--bad);min-height:18px;margin-top:8px;font-size:13px}

  /* каркас */
  #shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .side{background:var(--brand-d);color:#dbe6f1;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{font-weight:800;font-size:18px;color:#fff;padding:0 8px 16px}
  .brand small{font-weight:400;opacity:.7;font-size:12px;margin-left:4px}
  #nav a{display:flex;justify-content:space-between;align-items:center;color:#dbe6f1;text-decoration:none;padding:8px 10px;border-radius:6px;margin-bottom:2px}
  #nav a:hover{background:rgba(255,255,255,.08)}
  #nav a.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
  #nav .n{background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700}
  .side-f{margin-top:18px;padding:12px 10px;border-top:1px solid rgba(255,255,255,.15)}
  .side-f a{color:#fff;display:block;margin-bottom:6px}
  .main{padding:22px 26px 60px;min-width:0}
  #pubbar:empty{display:none}
  #pubbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accent-l);border:1px solid #f0c9a0;border-radius:10px;padding:10px 14px;margin-bottom:18px}
  #pubbar.run{background:var(--brand-l);border-color:#b9d0e8}
  #pubbar .t{flex:1;min-width:200px}

  /* сводка */
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid var(--hair);border-radius:10px;padding:12px 14px;text-decoration:none;color:inherit;box-shadow:var(--sh)}
  .kpi b{display:block;font-size:24px}
  .kpi span{color:var(--ink-2);font-size:13px}
  .kpi.warn b{color:var(--accent)}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--hair);vertical-align:top}
  th{font-weight:600;color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:.02em}
  tr.click{cursor:pointer}
  tr.click:hover td{background:#f7f9fb}
  .tw{overflow-x:auto}
  pre.log{white-space:pre-wrap;background:#f6f7f9;border:1px solid var(--hair);border-radius:6px;padding:10px;font-size:12px;max-height:340px;overflow:auto;margin:8px 0 0}
  .okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}

  /* списки лотов */
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .bar input[type=search]{flex:1;min-width:200px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tabs a{padding:6px 12px;border-radius:16px;border:1px solid var(--hair-2);text-decoration:none;color:var(--ink);background:#fff}
  .tabs a.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .lot{display:grid;grid-template-columns:24px 84px 1fr auto;gap:12px;align-items:start;background:#fff;border:1px solid var(--hair);border-radius:10px;padding:10px;margin-bottom:8px}
  .lot .th{width:84px;height:62px;border-radius:6px;overflow:hidden;background:#eef1f4;display:grid;place-items:center;font-size:11px;color:var(--ink-3)}
  .lot .th img{width:100%;height:100%;object-fit:cover}
  .lot .nm{font-weight:600;text-decoration:none;color:var(--ink);display:block}
  .lot .nm:hover{color:var(--brand)}
  .lot .meta{color:var(--ink-2);font-size:13px;margin-top:2px}
  .lot .acts{display:flex;flex-direction:column;gap:5px;align-items:stretch}
  .lot .ck{padding-top:4px}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:12px;padding:1px 8px;border-radius:10px;background:#eef1f4;color:var(--ink-2)}
  .chip.r{background:var(--accent-l);color:#9a4f0e}
  .chip.g{background:var(--ok-l);color:var(--ok)}
  .chip.b{background:var(--bad-l);color:var(--bad)}
  .chip.bl{background:var(--brand-l);color:var(--brand)}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px}
  .empty{padding:30px;text-align:center;color:var(--ink-3);background:#fff;border:1px dashed var(--hair-2);border-radius:10px}
  .sim{margin-top:8px;padding:8px 10px;background:#f7f9fb;border-radius:6px;font-size:13px}

  /* формы настроек */
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .fld>span{font-size:13px;color:var(--ink-2)}
  .fld .hint{font-size:12px;color:var(--ink-3)}
  .fld .hint a{cursor:pointer}
  .tog{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair)}
  .tog:last-child{border-bottom:0}
  .tog .d{flex:1}
  .tog small{display:block;color:var(--ink-3)}
  .sw{position:relative;width:40px;height:22px;flex:none}
  .sw input{opacity:0;width:0;height:0;position:absolute}
  .sw i{position:absolute;inset:0;background:#c6cdd6;border-radius:12px;transition:.15s;cursor:pointer}
  .sw i:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
  .sw input:checked+i{background:var(--ok)}
  .sw input:checked+i:before{transform:translateX(18px)}
  .hours{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;max-width:560px}
  .hours label{border:1px solid var(--hair-2);border-radius:6px;text-align:center;padding:5px 0;cursor:pointer;font-size:13px;background:#fff}
  .hours input{display:none}
  .hours label.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .ctab td input,.ctab td textarea{width:100%}
  .ctab td{min-width:90px}
  .saverow{display:flex;gap:10px;align-items:center;margin-top:8px}

  /* карточка лота (шторка) */
  .drawer{position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:50;display:flex;justify-content:flex-end}
  .drawer[hidden]{display:none}
  .dw{width:min(720px,100%);height:100%;overflow:auto;background:var(--bg);box-shadow:var(--sh-2);padding:18px 20px 90px}
  .dw-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
  .dw-h h2{flex:1;font-size:18px;margin:0}
  .dw-foot{position:fixed;bottom:0;right:0;width:min(720px,100%);background:#fff;border-top:1px solid var(--hair);padding:12px 20px;display:flex;gap:10px;align-items:center}
  .ph-edit{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .ph-edit img{width:200px;height:140px;object-fit:cover;border-radius:8px;background:#eef1f4}
  .orig{font-size:12px;color:var(--ink-3);margin-top:3px;max-height:90px;overflow:auto}
  .radios{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0}
  .radios label{display:flex;gap:5px;align-items:center}

  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw}
  #toast.on{opacity:1}
  #toast.err{background:var(--bad)}
  .x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--ink-3)}

  @media (max-width:860px){
    #shell{grid-template-columns:1fr}
    .side{position:sticky;top:0;height:auto;z-index:20;padding:8px 10px;display:flex;gap:10px;align-items:center;overflow-x:auto}
    .brand{padding:0 6px;white-space:nowrap}
    #nav{display:flex;gap:4px}
    #nav a{white-space:nowrap;padding:6px 9px}
    .side-f{display:none}
    .main{padding:16px 16px 60px}
    .lot{grid-template-columns:20px 64px 1fr}
    .lot .th{width:64px;height:48px}
    .lot .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
    .hours{grid-template-columns:repeat(6,1fr)}
  }
</style>
</head>
<body>

<div id="login" hidden>
  <form id="lf" autocomplete="on">
    <h1>БелЛот · админка</h1>
    <label for="l-u">Логин</label><input id="l-u" autocomplete="username" required>
    <label for="l-p">Пароль</label><input id="l-p" type="password" autocomplete="current-password" required>
    <button class="btn pri" type="submit">Войти</button>
    <div class="err" id="l-err"></div>
  </form>
</div>

<div id="shell" hidden>
  <aside class="side">
    <div class="brand">БелЛот<small>админка</small></div>
    <nav id="nav"></nav>
    <div class="side-f"><a href="../" target="_blank" rel="noopener">Открыть сайт ↗</a><a href="#" id="logout">Выйти</a></div>
  </aside>
  <div class="main"><div id="pubbar"></div><main id="view"></main></div>
</div>
<div id="drawer" class="drawer" hidden></div>
<div id="toast"></div>

<script src="../stats.js?v=__BUILD__"></script>
<script>
const SB = '__SB_URL__', KEY = '__SB_KEY__';
const RAW = 'https://raw.githubusercontent.com/Ringo2122/bellot-site/main/data/';
const GH_RUNS = 'https://github.com/Ringo2122/bellot-site/actions';
const PLATS = ['e-auction.by','ipmtorgi.by','beltorgi.by','konfiskat.by'];
const PLAT_RU = {'e-auction.by':'e-auction.by (БелЮрОбеспечение)','ipmtorgi.by':'ipmtorgi.by (ИПМ-Торги)','beltorgi.by':'beltorgi.by (Белреализация)',
  'konfiskat.by':'konfiskat.by (ТД «Восточный»)'};
const SECS = [['nedvizhimost','Недвижимость'],['avto','Легковые авто'],['gruz','Грузовые и автобусы'],['spec','Спецтехника'],['oborud','Оборудование']];
const SEC_RU = Object.fromEntries(SECS);
const MIN_DEF = {oborud:3000};
const REASON = {no_photo:'нет фото', no_price:'нет цены', no_city:'нет города', rule_deadline:'срок заявок по правилу (извещение — скан)', dup_maybe:'похож на лот другой площадки'};
const HIDDEN = {mod:'ждёт проверки', hidden:'скрыт вами', dup:'склеен с другим лотом', plat_off:'площадка выключена', sec_off:'раздел выключен'};
const TRIG = {schedule:'по расписанию', admin:'из админки', push:'обновление кода', workflow_dispatch:'вручную на GitHub', manual:'вручную', setup:'подключение админки'};
// разделы, которые читает Telegram-бот (tgbot.rb, SECTIONS)
const BOT_SECS = [['e-auction.by','Недвижимость'],['e-auction.by','Легковые авто'],['e-auction.by','Грузовые и автобусы'],
  ['ipmtorgi.by','Недвижимость'],['ipmtorgi.by','Транспорт и спецтехника'],['beltorgi.by','Недвижимость'],['beltorgi.by','Легковые авто'],
  ['beltorgi.by','Грузовые и автобусы'],
  ['konfiskat.by','Автотранспорт'],['konfiskat.by','Недвижимость']];

/* ── мелочи ── */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => n==null||n==='' ? '—' : Math.round(+n).toLocaleString('ru-RU');
const p2 = n => String(n).padStart(2,'0');
const dt = s => { if(!s) return '—'; const d = new Date(typeof s==='number'||/^\d+$/.test(s) ? s*1000 : s);
  return `${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const toLocal = s => { if(!s) return ''; const d = new Date(s*1000); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const fromLocal = v => v ? Math.round(new Date(v).getTime()/1000) : null;
const enc = encodeURIComponent;
const inq = keys => `in.(${keys.map(k=>'"'+String(k).replace(/"/g,'')+'"').join(',')})`;
const nowIso = () => new Date().toISOString();
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = 'on' + (err?' err':''); clearTimeout(t._h); t._h = setTimeout(()=>t.className='', err?5000:2500); }
const plural = (n,a,b,c) => { n = Math.abs(n)%100; const m = n%10; return n>10&&n<20?c : m>1&&m<5?b : m===1?a : c; };

/* ── связь с базой ── */
let TOKEN = ''; try{ TOKEN = localStorage.getItem('bl_adm') || ''; }catch(e){}
async function api(path, o={}){
  const h = { apikey: KEY, 'Content-Type':'application/json' };
  if(TOKEN) h['x-admin-token'] = TOKEN;
  if(o.prefer) h.Prefer = o.prefer;
  if(o.count) h.Prefer = 'count=exact';
  const r = await fetch(SB + '/rest/v1/' + path, { method:o.method||'GET', headers:h, body:o.body!==undefined?JSON.stringify(o.body):undefined });
  if(!r.ok){ let j = {}; try{ j = await r.json(); }catch(e){}
    if(/Нет доступа/.test(j.message||'') && !o.login){ logout(true); }
    throw new Error(j.message || ('ошибка ' + r.status)); }
  if(o.count){ const rows = await r.json(); return { rows, total: +((r.headers.get('content-range')||'').split('/')[1]) || rows.length }; }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
const rpc = (fn, args={}, o={}) => api('rpc/'+fn, Object.assign({ method:'POST', body:args }, o));
const upsert = (table, rows, conflict='key') => api(`${table}?on_conflict=${conflict}`, { method:'POST', body:rows, prefer:'resolution=merge-duplicates,return=minimal' });

/* ── вход ── */
function showLogin(){ $('#shell').hidden = true; $('#login').hidden = false; $('#l-u').focus(); }
$('#lf').addEventListener('submit', async e=>{
  e.preventDefault(); $('#l-err').textContent = '';
  try{
    const tok = await rpc('admin_login', { p_login:$('#l-u').value, p_pass:$('#l-p').value }, { login:true });
    if(!tok){ $('#l-err').textContent = 'Неверный логин или пароль'; return; }
    TOKEN = tok; try{ localStorage.setItem('bl_adm', tok); }catch(e){}
    $('#l-p').value = ''; start();
  }catch(err){ $('#l-err').textContent = err.message; }
});
async function logout(silent){
  if(!silent){ try{ await rpc('admin_logout'); }catch(e){} }
  TOKEN = ''; try{ localStorage.removeItem('bl_adm'); }catch(e){}
  $('#drawer').hidden = true; showLogin();
}
$('#logout').addEventListener('click', e=>{ e.preventDefault(); logout(); });

/* ── общее состояние ── */
let STATS = {}, SET = {}, LASTRUN = null;
async function loadSettings(){ SET = Object.fromEntries((await api('settings?select=k,v')).map(r=>[r.k, r.v])); }
async function saveSetting(k, v){ await upsert('settings', [{ k, v, updated_at: nowIso() }], 'k'); SET[k] = v; }
async function refreshStats(){
  [STATS, LASTRUN] = await Promise.all([ rpc('admin_stats'), api('runs?select=id,at,finished_at,kind,ok,trigger&order=at.desc&limit=1').then(r=>r[0]||null) ]);
  const pr = await api('settings?k=eq.publish_req&select=v'); SET.publish_req = pr[0] ? pr[0].v : null;
  drawNav(); drawPubbar();
}

const PAGES = [
  ['dash','Сводка'], ['stats','Аналитика'], ['queue','Проверка'], ['lots','Лоты'], ['dups','Дубли'], ['market','Ориентиры'], ['leads','Заявки'], ['users','Пользователи'],
  ['sources','Площадки и разделы'], ['calc','Калькулятор'], ['bot','Telegram-бот'], ['services','Услуги'], ['texts','Тексты сайта'], ['access','Доступ']
];
function drawNav(){
  const cur = (location.hash.slice(1).split('?')[0]) || 'dash';
  const badge = { queue: STATS.queue, leads: STATS.leads_new };
  $('#nav').innerHTML = PAGES.map(([k,t])=>`<a href="#${k}" class="${k===cur?'on':''}">${t}${badge[k]?`<span class="n">${badge[k]}</span>`:''}</a>`).join('');
}
function drawPubbar(){
  const b = $('#pubbar'); b.className = '';
  const running = LASTRUN && !LASTRUN.finished_at && (Date.now() - new Date(LASTRUN.at)) < 90*60000;
  const req = SET.publish_req, lastAt = LASTRUN ? new Date(LASTRUN.at).getTime() : 0;
  const waiting = req && req.at*1000 > lastAt;
  const changed = STATS.changed_at && (!STATS.last_build || new Date(STATS.changed_at) > new Date(STATS.last_build));
  if(running){
    b.className = 'run';
    b.innerHTML = `<div class="t">⏳ Робот работает с ${dt(LASTRUN.at)}: ${LASTRUN.kind==='collect'?'обходит площадки и собирает сайт (10–25 минут)':'собирает сайт (2–4 минуты)'}.
      ${changed && new Date(STATS.changed_at) > new Date(LASTRUN.at) ? 'Правки, сделанные после начала, попадут в следующую публикацию.' : ''}</div>
      <a class="btn sm" href="${GH_RUNS}" target="_blank" rel="noopener">Ход работы ↗</a>`;
  } else if(waiting){
    b.className = 'run';
    b.innerHTML = `<div class="t">🕓 ${req.collect?'Обновление с площадок':'Публикация'} запрошена в ${dt(req.at)}. ${STATS.github?'Робот запускается.':'Робот проверяет запросы каждые 10 минут — начнёт в ближайшее время.'}</div>`;
  } else if(changed){
    b.innerHTML = `<div class="t"><b>Есть изменения, которых ещё нет на сайте.</b> Сделайте все правки и опубликуйте разом — сайт пересоберётся за несколько минут.</div>
      <button class="btn acc" data-pub="0">Опубликовать изменения</button>`;
  } else b.innerHTML = '';
}
document.addEventListener('click', async e=>{
  const p = e.target.closest('[data-pub]'); if(!p) return;
  const collect = p.dataset.pub === '1';
  if(collect && !confirm('Обойти все площадки сейчас? Это займёт 10–25 минут, потом сайт обновится.')) return;
  p.disabled = true;
  try{ const r = await rpc('request_publish', { p_collect: collect });
    toast(r==='dispatched' ? 'Робот запущен' : 'Запрос принят — робот начнёт в течение 10 минут'); await refreshStats();
    if((location.hash.slice(1)||'dash')==='dash') route(); }
  catch(err){ toast(err.message, true); p.disabled = false; }
});

/* ── строка лота ── */
function stateChips(l){
  const c = [];
  if(l.status==='archive'){ c.push(['архив',''])
    const r = l.result, R = { sold:['продан','g'], single:['продан единственному','g'], failed:['торги не состоялись','r'], cancelled:['отменены',''] };
    if(r && R[r.st]) c.push([R[r.st][0] + (r.price ? ' за ' + nf(r.price) + ' BYN' : ''), R[r.st][1]]); }
  else if(l.mstate==='hidden') c.push(['скрыт вами','b']);
  else if(l.mstate==='queue') c.push([l.published?'на проверке — снимется с сайта после публикации':'ждёт проверки','r']);
  else if(l.mstate==='ok') c.push([l.published?'одобрен · на сайте':'одобрен — появится после публикации','g']);

  if(l.edited) c.push(['изменён вами','bl']);

  if(l.ov_at && l.synced && new Date(l.ov_at).getTime()/1000 > l.synced) c.push(['правки не опубликованы','r']);
  (l.reasons||[]).forEach(r=>c.push([REASON[r]||r,'r']));
  return `<div class="chips">${c.map(([t,k])=>`<span class="chip ${k}">${esc(t)}</span>`).join('')}</div>`;
}

async function setMarket(key, m){

      api('lots_v?status=eq.active&reasons=cs.{dup_maybe}&select=key,name,platform,price,url,req_to,dup_with&limit=500'),

    const groups = mainKeys.map(k=>[mains[k], members.filter(m=>m.dup_of===k)]).filter(g=>g[0]);

/* Ориентиры */
async function pMarket(params){
  const only = params.get('f') || 'odd';
  RELOAD = async () => {
    const rows = await api('lots_v?status=eq.active&or=(market.not.is.null,fields->market.not.is.null)&select=*&limit=2000');
    const disc = l => { const m = (l.fields||{}).market && (l.fields||{}).market.median ? l.fields.market : l.market; const p = (l.fields||{}).price || l.price;
      return m && m.median ? Math.round((m.median - p) / m.median * 100) : null; };
    let list = rows.map(l=>[l, disc(l)]).sort((a,b)=>(b[1]??-999)-(a[1]??-999));
    if(only==='odd') list = list.filter(([l,d])=>(d!=null && (d>=50 || d<0)) || (l.fields||{}).market);
    const acts = l => { const fm = (l.fields||{}).market;
      return (fm ? B('mk-auto','Вернуть автоматический') : B('mk-off','Отключить','bad')) + B('mk-own','Своя оценка') + B('edit','Изменить'); };
    const info = (l, d) => { const fm = (l.fields||{}).market, m = l.market;
      const t = fm ? (fm.off ? '<span class="badc">ориентир отключён вами</span>' : `<b>своя оценка: ${nf(fm.median)} BYN</b>${fm.note?' — '+esc(fm.note):''}`)
        : m ? `медиана ${nf(m.median)} BYN по ${m.n} объявлениям ${esc(m.source||'')}${m.link?` · <a href="${esc(m.link)}" target="_blank" rel="noopener">похожие ↗</a>`:''}` : '';
      return `<div class="sim">${t}${d!=null && !(fm&&fm.off)?` · <b>${d>=0?'дешевле рынка на '+d:'дороже рынка на '+(-d)}%</b>`:''}</div>`; };
    $('#mlist').innerHTML = list.length ? `<p class="muted">${nf(list.length)} ${plural(list.length,'лот','лота','лотов')}</p>` + list.slice(0,300).map(([l,d])=>lotRow(l, acts, info(l,d))).join('')
      : '<div class="empty">Нет лотов для проверки.</div>';
  };
  V().innerHTML = `<h1>Рыночные ориентиры</h1><p class="lede">Робот сравнивает лот с похожими объявлениями на Kufar. Если сравнение неудачное (другая модель, развалюха против нового), отключите ориентир или впишите свою оценку — на сайте она покажется как «Оценка БелЛот».</p>
    <div class="tabs"><a href="#market" class="${only==='odd'?'on':''}">Подозрительные (дисконт от 50% или цена выше рынка)</a><a href="#market?f=all" class="${only==='all'?'on':''}">Все с ориентиром</a></div>
    <div id="mlist"><p class="muted">Загрузка…</p></div>`;
  await RELOAD();
}

/* Заявки */
async function pLeads(params){
  const st = params.get('st') || 'open';

  RELOAD = async () => {
    const f = st==='open' ? 'status=in.(new,work)&' : st==='all' ? '' : `status=eq.${st}&`;
    const rows = await api(`leads?${f}select=*&order=created_at.desc&limit=300`);
    $('#ldl').innerHTML = rows.length ? `<div class="tw"><table><tr><th>Когда</th><th>Клиент</th><th>Лот</th><th>Статус</th><th>Комментарий</th><th></th></tr>
      ${rows.map(r=>`<tr data-id="${r.id}"><td>${dt(r.created_at)}</td>
        <td style="white-space:normal;max-width:320px"><b>${esc(r.name)}</b><br><a href="tel:${esc(r.phone.replace(/[^+\d]/g,''))}">${esc(r.phone)}</a>${r.email?`<br><a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`:''}
          ${r.msg?`<div class="muted" style="margin-top:6px;font-style:italic">«${esc(r.msg)}»</div>`:''}</td>
        <td>${r.lot_id?`<a href="../#/lot/${enc(r.lot_id)}" target="_blank" rel="noopener">${esc((r.lot_name||r.lot||r.lot_id).slice(0,70))}</a>`
            : r.lot?`<a href="../#/catalog?q=${enc(r.lot)}" target="_blank" rel="noopener">${esc(r.lot)}</a>`:'<span class="muted">—</span>'}
          ${r.service?`<br><span class="chip bl">${esc(r.service)}</span>`:''}

        <td><select class="lst">${Object.entries(LS).map(([k,t])=>`<option value="${k}"${k===r.status?' selected':''}>${t}</option>`).join('')}</select></td>
        <td style="min-width:220px"><textarea class="lcm" rows="2" placeholder="Заметка">${esc(r.comment||'')}</textarea></td>
        <td><button class="btn sm bad ldel">Удалить</button></td></tr>`).join('')}</table></div>`
      : '<div class="empty">Заявок нет.</div>';
    $('#ldl').querySelectorAll('tr[data-id]').forEach(tr=>{
      const id = tr.dataset.id, save = async (o, msg) => { try{ await api(`leads?id=eq.${id}`, { method:'PATCH', body:Object.assign(o, { updated_at:nowIso() }), prefer:'return=minimal' }); toast(msg); refreshStats(); }catch(err){ toast(err.message, true); } };
      tr.querySelector('.lst').onchange = e=>save({ status:e.target.value }, 'Статус сохранён');
      tr.querySelector('.lcm').onchange = e=>save({ comment:e.target.value }, 'Комментарий сохранён');
      tr.querySelector('.ldel').onclick = async ()=>{ if(!confirm('Удалить заявку?')) return;
        try{ await api(`leads?id=eq.${id}`, { method:'DELETE' }); toast('Удалено'); await refreshStats(); await RELOAD(); }catch(err){ toast(err.message, true); } };
    });
  };
  V().innerHTML = `<h1>Заявки «Помощь в аукционе»</h1><p class="lede">Заявки с формы на сайте. Статус и комментарий сохраняются сразу.</p>
    <div class="tabs">${[['open','Новые и в работе'],['new','Новые'],['work','В работе'],['deal','Сделка'],['refused','Отказ'],['all','Все']].map(([k,t])=>`<a href="#leads?st=${k}" class="${k===st?'on':''}">${t}</a>`).join('')}</div>
    <div id="ldl"><p class="muted">Загрузка…</p></div>`;
  await RELOAD();
}

/* Telegram-бот */
async function pBot(){
  await loadSettings();
  const b = SET.bot||{}, off = new Set(b.off||[]);
  const since = new Date(Date.now() - 7*86400000).toISOString();
  const runs = await api(`bot_runs?select=*&at=gte.${since}&order=at.desc&limit=1000`);
  const days = {};
  runs.forEach(r=>{ const d = new Date(r.at); const k = `${p2(d.getDate())}.${p2(d.getMonth()+1)}`; const x = days[k] ||= { sent:0, by:{} };
    x.sent += r.sent; Object.entries((r.stats||{}).by||{}).forEach(([p,n])=>x.by[p] = (x.by[p]||0) + n); });
  const byPlat = {}; BOT_SECS.forEach(([p,s])=>(byPlat[p] ||= []).push(s));
  V().innerHTML = `<h1>Telegram-бот</h1><p class="lede">Бот проверяет площадки каждые 15 минут и присылает в Telegram новые лоты. Настройки применяются со следующей проверки, публиковать не нужно.</p>
    <div class="panel"><div class="tog"><div class="d"><b>Бот работает</b><small>Выключите, чтобы поставить на паузу. Лоты, вышедшие за время паузы, бот не пришлёт.</small></div>${sw('b-on', !b.paused)}</div></div>
    <div class="panel"><h2>Что присылать</h2>${Object.entries(byPlat).map(([p,ss])=>`<div style="margin-bottom:10px"><b>${esc(PLAT_RU[p])}</b>
      ${[...new Set(ss)].map(s=>`<div class="tog"><div class="d">${esc(s)}</div>${sw('bs-'+btoa(unescape(encodeURIComponent(p+'|'+s))).replace(/=/g,''), !off.has(p+'|'+s))}</div>`).join('')}</div>`).join('')}
      <p class="muted">Выключенный раздел бот читает, но не присылает: после включения старые лоты не посыплются.</p></div>
    <div class="saverow" style="margin-bottom:16px"><button class="btn pri" id="bsave">Сохранить</button></div>
    <div class="panel"><h2>Отправлено за 7 дней</h2>${Object.keys(days).length ? `<table><tr><th>День</th><th>Всего</th>${PLATS.map(p=>`<th>${esc(p)}</th>`).join('')}</tr>
      ${Object.entries(days).map(([d,x])=>`<tr><td>${d}</td><td><b>${x.sent}</b></td>${PLATS.map(p=>`<td>${x.by[p]||0}</td>`).join('')}</tr>`).join('')}</table>` : '<p class="muted">Данных пока нет — бот начнёт отчитываться со следующей проверки.</p>'}</div>
    <div class="panel"><h2>Последние проверки</h2>${runs.length ? `<table><tr><th>Когда</th><th>Отправлено</th><th>Новых</th><th>Замечания</th></tr>
      ${runs.slice(0,30).map(r=>`<tr><td>${dt(r.at)}</td><td>${r.sent}</td><td>${(r.stats||{}).fresh??'—'}</td><td>${esc(r.errors||'')}</td></tr>`).join('')}</table>` : '<p class="muted">Нет данных.</p>'}</div>`;
  $('#bsave').onclick = async ()=>{
    const offl = [];
    BOT_SECS.forEach(([p,s])=>{ const el = document.getElementById('bs-'+btoa(unescape(encodeURIComponent(p+'|'+s))).replace(/=/g,'')); if(el && !el.checked && !offl.includes(p+'|'+s)) offl.push(p+'|'+s); });
    try{ await saveSetting('bot', { paused: !$('#b-on').checked, off: offl }); toast('Сохранено'); }catch(err){ toast(err.message, true); }
  };
}

async function loadAll(path){ const out = []; for(let off = 0; ; off += 1000){ const r = await api(`${path}&limit=1000&offset=${off}`); out.push(...r); if(r.length < 1000) return out; } }
// данные аналитики держим 5 минут: смена фильтра не перекачивает тысячи лотов
let STATS_DATA = null;
async function pStats(params){
  const f = Object.fromEntries(['per','sec','plat','reg','kind'].map(k=>[k, params.get(k) || '']));
  if(!STATS_DATA || Date.now() - STATS_DATA.at > 300000){
    const since = new Date(Date.now() - 365*86400000).toISOString();
    const [lots, daily, leads, bots, sales] = await Promise.all([
      loadAll(`lots?select=${BLStats.FIELDS}&order=key`),
      api('daily?select=day,stats&order=day.asc&limit=400'),
      api('leads?select=created_at,status&limit=5000'),
      api(`bot_runs?select=at,sent,stats&at=gte.${since}&limit=20000`),
      loadAll('sales?select=*&order=key,at') ]);
    STATS_DATA = { at:Date.now(), lots, daily, leads, bots, sales };
  }
  const { lots, daily, leads, bots, sales } = STATS_DATA;
  await loadSettings();
  const cab = new Set((SET.cab_stats||{}).blocks || BLStats.DEFAULT_CAB);
  V().innerHTML = `<h1>Аналитика</h1><p class="lede">Рынок — активные лоты всех площадок без дублей и скрытых вами.</p><div id="an"></div>
    <div class="panel"><h2>Что видят пользователи в личном кабинете</h2>
      <p class="muted" style="margin-top:0">Отметьте блоки, которые показывать в разделе «Аналитика» кабинета. Действует сразу, публиковать не нужно. «Качество данных» и «Заявки и бот» — только для админки.</p>
      <div class="grid2">${BLStats.BLOCKS.filter(([k])=>!BLStats.ADMIN_ONLY.includes(k)).map(([k,t])=>`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-cab="${k}"${cab.has(k)?' checked':''}> ${t}</label>`).join('')}</div>
      <div class="saverow"><button class="btn pri" id="cabsave">Сохранить</button></div></div>`;
  BLStats.render($('#an'), { lots, daily, leads, bots, sales, f, admin:true, site:'../',
    href:x => '#stats?' + new URLSearchParams(Object.entries(x).filter(([,v])=>v)).toString() });
  $('#cabsave').onclick = async () => {
    const blocks = [...V().querySelectorAll('[data-cab]:checked')].map(i=>i.dataset.cab);
    try{ await saveSetting('cab_stats', { blocks }); toast('Сохранено — в кабинете уже так'); }catch(err){ toast(err.message, true); }
  };
}

      const services = list.map(x=>({ t:x.t.trim(), d:x.d.trim(), p:x.p.trim(), i:x.i })).filter(x=>x.t);
      if(!services.length){ toast('Нужна хотя бы одна услуга', true); return; }
      try{ await saveSetting('texts', Object.assign({}, SET.texts || {}, { services })); list = services; toast('Сохранено — опубликуйте, чтобы обновить сайт'); refreshStats(); draw(); }catch(err){ toast(err.message, true); } };
  };
  draw();
}

/* Доступ */
async function pAccess(){
  V().innerHTML = `<h1>Доступ</h1>
    <div class="panel"><h2>Сменить пароль</h2><div class="grid2">
      <label class="fld"><span>Текущий пароль</span><input type="password" id="pw0" autocomplete="current-password"></label>
      <label class="fld"><span>Новый пароль</span><input type="password" id="pw1" autocomplete="new-password"></label>
      <label class="fld"><span>Новый пароль ещё раз</span><input type="password" id="pw2" autocomplete="new-password"></label></div>
      <button class="btn pri" id="pwgo">Сменить пароль</button></div>
    <div class="panel"><h2>Мгновенная публикация</h2>
      <p style="margin-top:0">Сейчас робот проверяет запросы на публикацию каждые 10 минут. Чтобы он запускался сразу, сохраните здесь ключ GitHub.
      ${STATS.github?'<span class="okc">Ключ сохранён.</span>':'<span class="muted">Ключ не сохранён.</span>'}</p>
      <ol class="muted"><li>Откройте <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com → Fine-grained token</a>.</li>
        <li>Repository access → Only select repositories → <b>bellot-site</b>.</li>
        <li>Permissions → Actions → <b>Read and write</b>. Generate token, скопируйте ключ.</li></ol>
      <div class="bar"><input type="password" id="ghk" placeholder="github_pat_…" style="flex:1"><button class="btn pri" id="ghgo">Сохранить ключ</button>${STATS.github?'<button class="btn bad" id="ghdel">Удалить ключ</button>':''}</div>
      <p class="muted">Ключ хранится в зашифрованном хранилище базы и нигде не показывается.</p></div>
    <div class="panel"><h2>Сеансы</h2><p style="margin-top:0">Вход действует 30 дней на каждом устройстве.</p>
      <button class="btn" id="lo1">Выйти</button> <button class="btn bad" id="loa">Выйти на всех устройствах</button></div>`;
  $('#pwgo').onclick = async ()=>{
    if($('#pw1').value !== $('#pw2').value){ toast('Новые пароли не совпадают', true); return; }
    try{ await rpc('admin_passwd', { p_old:$('#pw0').value, p_new:$('#pw1').value }); toast('Пароль изменён'); ['pw0','pw1','pw2'].forEach(i=>$('#'+i).value=''); }
    catch(err){ toast(err.message, true); }
  };
  $('#ghgo').onclick = async ()=>{ const v = $('#ghk').value.trim(); if(!v){ toast('Вставьте ключ', true); return; }
    try{ await rpc('set_github_token', { p_token:v }); $('#ghk').value = ''; toast('Ключ сохранён'); await refreshStats(); pAccess(); }catch(err){ toast(err.message, true); } };
  if($('#ghdel')) $('#ghdel').onclick = async ()=>{ try{ await rpc('set_github_token', { p_token:'' }); toast('Ключ удалён'); await refreshStats(); pAccess(); }catch(err){ toast(err.message, true); } };
  $('#lo1').onclick = ()=>logout();
  $('#loa').onclick = async ()=>{ try{ await rpc('admin_logout', { p_all:true }); }catch(e){} logout(true); };
}

/* ── карточка лота ── */
async function openEditor(key){
  const dw = $('#drawer'); dw.hidden = false;
  dw.innerHTML = '<div class="dw"><p class="muted">Загрузка…</p></div>';
  const [[l], ph] = await Promise.all([ api(`lots_v?key=eq.${enc(key)}&select=*`), api(`lot_photos?key=eq.${enc(key)}&select=data`) ]);
  if(!l){ dw.innerHTML = '<div class="dw"><p>Лот не найден.</p></div>'; return; }
  let det = [];
  try{ const r = await fetch(`${RAW}det/${enc(key)}.json`); if(r.ok) det = await r.json(); }catch(e){}
  const origDescr = (det.flatMap(s=>s.rows||[]).find(([k])=>/^Описание/i.test(k))||[])[1] || '';
  const f = Object.assign({}, l.fields||{});
  const fm = f.market || null;
  let newPhoto = null, dropPhoto = false;
  const curPhoto = ph[0] ? ph[0].data : l.photo ? `${RAW}ph/${enc(key)}.jpg` : '';
  const val = k => f[k]!=null ? f[k] : '';
  const hint = (k, shown) => `<div class="hint">С площадки: ${shown||'—'}${f[k]!=null?` · <a data-reset="${k}">вернуть значение площадки</a>`:''}</div>`;
  dw.innerHTML = `<div class="dw" role="dialog" aria-label="Карточка лота">
    <div class="dw-h"><h2>${esc(f.name||l.name)}</h2><button class="x" id="dwx" aria-label="Закрыть">×</button></div>
    <p class="muted" style="margin-top:-6px">${esc(l.platform)} · <a href="${esc(l.url)}" target="_blank" rel="noopener">на площадке ↗</a>${l.published&&l.status==='active'?` · <a href="../#/lot/${enc(l.id)}" target="_blank" rel="noopener">на сайте ↗</a>`:''} · ключ ${esc(l.key)}</p>
    ${stateChips(l)}
    <div class="panel" style="margin-top:12px"><h2>Публикация</h2>
      <div class="radios">${[['','по правилам (авто)'],['approved','одобрен'],['review','на проверке — не показывать'],['hidden','скрыт']].map(([k,t])=>`<label><input type="radio" name="mod" value="${k}"${(l.mod||'')===k?' checked':''}> ${t}</label>`).join('')}</div>
      <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="e-pin"${l.pinned?' checked':''}> ★ Закрепить в блоке «Рекомендуем» на главной</label></div>
    <div class="panel"><h2>Фото</h2><div class="ph-edit"><img id="e-img" src="${esc(curPhoto)}" alt="" ${curPhoto?'':'hidden'}>
      <div><label class="btn">Загрузить своё фото<input type="file" id="e-file" accept="image/*" hidden></label>
      ${ph[0]?'<button class="btn bad" id="e-phdel" style="margin-left:6px">Убрать своё фото</button>':''}
      <div class="hint muted" style="margin-top:6px">Своё фото заменит фото площадки.</div></div></div></div>
    <div class="panel"><h2>Данные лота</h2><p class="muted" style="margin-top:0">Измените только то, что нужно. Изменённое поле робот больше не перезаписывает, даже если площадка его поменяет.</p>
      <label class="fld"><span>Название</span><textarea rows="2" data-f="name" placeholder="${esc(l.name)}">${esc(val('name'))}</textarea>${hint('name', esc(l.name))}</label>
      <div class="grid2">
        <label class="fld"><span>Раздел</span><select data-f="section"><option value="">как у площадки</option>${SECS.map(([k,t])=>`<option value="${k}"${f.section===k?' selected':''}>${t}</option>`).join('')}</select>${hint('section', esc(SEC_RU[l.section]||l.section))}</label>
        <label class="fld"><span>Стартовая цена, BYN</span><input type="number" min="0" step="1" data-f="price" placeholder="${esc(l.price)}" value="${esc(val('price'))}">${hint('price', nf(l.price)+' BYN')}</label>
        <label class="fld"><span>Приём заявок до</span><input type="datetime-local" data-f="req_to" value="${toLocal(f.req_to)}">${hint('req_to', dt(l.req_to))}</label>
        <label class="fld"><span>Дата торгов</span><input type="datetime-local" data-f="torg" value="${toLocal(f.torg)}">${hint('torg', dt(l.torg))}</label>
      </div>
      <label class="fld"><span>Местоположение</span><input data-f="location" placeholder="${esc(l.location||'')}" value="${esc(val('location'))}">${hint('location', esc(l.location))}</label>
      <label class="fld"><span>Описание</span><textarea rows="5" data-f="descr" placeholder="Пусто — описание площадки">${esc(val('descr'))}</textarea>
        <div class="orig">С площадки: ${origDescr?esc(origDescr):'описания нет'}</div>${f.descr?'<div class="hint"><a data-reset="descr">вернуть описание площадки</a></div>':''}</label></div>
    <div class="panel"><h2>Рыночный ориентир</h2>
      <p class="muted" style="margin-top:0">${l.market?`Робот: медиана ${nf(l.market.median)} BYN по ${l.market.n} объявлениям ${esc(l.market.source||'')}.`:'Робот не нашёл ориентир.'}</p>
      <div class="radios">${[['auto','автоматический'],['off','не показывать'],['own','своя оценка']].map(([k,t])=>`<label><input type="radio" name="mk" value="${k}"${(fm?(fm.off?'off':'own'):'auto')===k?' checked':''}> ${t}</label>`).join('')}</div>
      <div class="grid2" id="mk-own" ${fm&&!fm.off?'':'hidden'}><label class="fld"><span>Оценка, BYN</span><input type="number" min="0" id="mk-v" value="${fm&&fm.median?fm.median:''}"></label>
        <label class="fld"><span>Комментарий для посетителей</span><input id="mk-n" value="${esc(fm&&fm.note||'')}"></label></div></div>
    <div class="dw-foot"><button class="btn pri" id="e-save">Сохранить</button><button class="btn" id="e-cancel">Отмена</button><span class="muted">На сайте — после публикации.</span></div>
  </div>`;
  const close = () => { dw.hidden = true; dw.innerHTML = ''; };
  $('#dwx').onclick = close; $('#e-cancel').onclick = close;
  dw.onclick = e=>{ if(e.target===dw) close(); };
  dw.querySelectorAll('[data-reset]').forEach(a=>a.onclick = ()=>{ const k = a.dataset.reset; delete f[k];
    const el = dw.querySelector(`[data-f="${k}"]`); if(el) el.value = ''; a.closest('.hint').textContent = 'Будет значение площадки'; });
  dw.querySelectorAll('input[name=mk]').forEach(r=>r.onchange = ()=>{ $('#mk-own').hidden = r.value!=='own' || !r.checked; });
  $('#e-file').onchange = async e=>{ const file = e.target.files[0]; if(!file) return;
    try{ newPhoto = await shrinkPhoto(file); dropPhoto = false; $('#e-img').src = newPhoto; $('#e-img').hidden = false; }catch(err){ toast(err.message, true); } };
  if($('#e-phdel')) $('#e-phdel').onclick = ()=>{ dropPhoto = true; newPhoto = null; $('#e-img').src = l.photo ? `${RAW}ph/${enc(key)}.jpg` : ''; $('#e-img').hidden = !l.photo; $('#e-phdel').remove(); };
  $('#e-save').onclick = async ()=>{
    const btn = $('#e-save'); btn.disabled = true;
    const fields = {};
    dw.querySelectorAll('[data-f]').forEach(el=>{
      const k = el.dataset.f; let v = el.value.trim();
      if(v==='') return;
      if(k==='price'){ v = +v; if(!(v>0) || v===+l.price) return; }
      else if(k==='req_to' || k==='torg'){ v = fromLocal(v); if(!v || v===l[k]) return; }
      else if(k==='section'){ if(v===l.section) return; }
      else if(k==='descr'){ if(v===origDescr.trim()) return; }
      else if(v===String(l[k]||'').trim()) return;
      fields[k] = v;
    });
    const mk = dw.querySelector('input[name=mk]:checked').value;
    if(mk==='off') fields.market = { off:true };
    else if(mk==='own'){ const v = +$('#mk-v').value; if(!(v>0)){ toast('Впишите оценку в BYN', true); btn.disabled = false; return; } fields.market = { median:v, note:$('#mk-n').value.trim() }; }
    const mod = dw.querySelector('input[name=mod]:checked').value || null;
    try{
      await upsert('overrides', [{ key, fields, mod, pinned:$('#e-pin').checked, updated_at:nowIso() }]);
      if(newPhoto) await upsert('lot_photos', [{ key, data:newPhoto, updated_at:nowIso() }]);
      else if(dropPhoto) await api(`lot_photos?key=eq.${enc(key)}`, { method:'DELETE' });
      toast('Сохранено. На сайте — после публикации'); close(); await refreshStats(); await RELOAD();
    }catch(err){ toast(err.message, true); btn.disabled = false; }
  };
}
function shrinkPhoto(file){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = () => { const k = Math.min(1, 1200/Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', 0.85)); };
    img.onerror = () => rej(new Error('Не удалось прочитать фото'));
    img.src = URL.createObjectURL(file);
  });
}
addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#drawer').hidden){ $('#drawer').hidden = true; $('#drawer').innerHTML = ''; } });

/* ── старт ── */
async function start(){
  if(!TOKEN){ showLogin(); return; }
  try{ const me = await rpc('admin_me'); if(!me){ logout(true); return; } }
  catch(e){ $('#login').hidden = false; $('#l-err').textContent = 'Нет связи с базой: ' + e.message; return; }
  $('#login').hidden = true; $('#shell').hidden = false;
  await Promise.all([ loadSettings(), refreshStats() ]);
  route();
}
start();
